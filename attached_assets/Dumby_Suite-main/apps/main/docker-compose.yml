services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dumby
      POSTGRES_PASSWORD: dumby_dev_password
      POSTGRES_DB: dumby
    ports:
      - "5432:5432"
    volumes:
      - dumby_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dumby -d dumby"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://dumby:dumby_dev_password@postgres:5432/dumby
      REDIS_URL: redis://redis:6379/0
      QUEUE_REDIS_URL: redis://redis:6379/1
    ports:
      - "8080:8080" # API_PORT
      - "8081:8081" # HEALTH_PORT
      - "8082:8082" # METRICS_PORT
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/health/liveness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  dumby_postgres_data:
