openapi: 3.1.0
info:
  title: Dumby API
  version: 5.0.0
  description: >-
    The HTTP surface the shipped server mounts. Every path below is a route
    registered under apps/main/src (or packages/*/src) at feature/dev c6c2c82a,
    enumerated with
    `rg -o "app\.(get|post|put|patch|delete)\(\s*'[^']+'" apps/main/src packages/*/src`.
    Fastify `:param` segments are written as OpenAPI `{param}`; nothing else is
    transformed. Where the specification names a different layout it is listed in
    x-spec-divergence, and the gap is recorded in status/code-reconciliation.json
    (REC-036, REC-037, REC-038). Paths under /admin, /mdis, /operational, /twill
    and /internal require the internal API key
    (apps/main/src/http/server.ts:79-91).
  x-spec-divergence:
    - "specified /info, /api/modules/:name/{config,state,:action}, /api/swastik/* -> shipped /api/info, /mdis/*, /swastik/* (REC-036)"
    - "specified POST /api/pep/{functionName} -> shipped POST /admin/power-engine/<action> (REC-037)"
    - "specified /channels/, /guilds/, /interactions/, /admin/operators -> not mounted (REC-038)"
servers: [ { url: / } ]
tags:
  - { name: health, description: probes and metrics }
  - { name: info, description: build info and assets }
  - { name: auth, description: Discord OAuth2 and dashboard }
  - { name: admin, description: control plane (internal key) }
  - { name: modules, description: MDIS module config and state (internal key) }
  - { name: swastik, description: developer, upload and module lifecycle (internal key) }
  - { name: operational, description: runbooks and status (internal key) }
  - { name: twill, description: persona registration (internal key) }
  - { name: internal, description: internal signals (internal key) }
