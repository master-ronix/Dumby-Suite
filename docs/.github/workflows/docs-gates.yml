name: docs-gates

on:
  push:
    paths: ['**/*.md', 'status/**', 'contracts/**', 'manifest.json', 'scripts/docs/**']
  pull_request:
    paths: ['**/*.md', 'status/**', 'contracts/**', 'manifest.json', 'scripts/docs/**']

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/docs/check-acceptance.mjs
      - run: node scripts/docs/check-anchor-paths.mjs
      - run: node scripts/docs/check-anchors.mjs
      - run: node scripts/docs/check-archive-guard.mjs
      - run: node scripts/docs/check-asset-adaptation.mjs
      - run: node scripts/docs/check-code-reconciliation.mjs
      - run: node scripts/docs/check-contracts.mjs
      - run: node scripts/docs/check-counts.mjs
      - run: node scripts/docs/check-coverage.mjs
      - run: node scripts/docs/check-frontmatter.mjs
      - run: node scripts/docs/check-ledger-content.mjs
      - run: node scripts/docs/check-manifest.mjs
      - run: node scripts/docs/check-no-restatement.mjs
      - run: node scripts/docs/check-reconciliation.mjs
      - run: node scripts/docs/check-status-evidence.mjs
