name: Deploy — Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @workspace/dumby typecheck
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.29.0
      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > /tmp/kubeconfig.yaml
      - name: Run DB migrations
        run: |
          kubectl --kubeconfig /tmp/kubeconfig.yaml -n dumby-staging \
            run dumby-migrate-$(date +%s) \
            --image=${{ vars.IMAGE_REGISTRY }}/dumby:${{ github.sha }} \
            --restart=Never \
            --env="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --command -- tsx src/entry/migrate.ts up
      - name: Apply K8s manifests
        run: |
          kubectl --kubeconfig /tmp/kubeconfig.yaml apply \
            -k deploy/k8s/overlays/staging
      - name: Update image tag
        run: |
          kubectl --kubeconfig /tmp/kubeconfig.yaml -n dumby-staging \
            set image deployment/dumby dumby=${{ vars.IMAGE_REGISTRY }}/dumby:${{ github.sha }}
      - name: Wait for rollout
        run: |
          kubectl --kubeconfig /tmp/kubeconfig.yaml -n dumby-staging \
            rollout status deployment/dumby --timeout=180s
