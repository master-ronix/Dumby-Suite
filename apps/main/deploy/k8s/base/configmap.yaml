apiVersion: v1
kind: ConfigMap
metadata:
  name: dumby-config
data:
  NODE_ENV: production
  LOG_LEVEL: info
  LOG_FORMAT: json
  DISCORD_ADAPTER: live
  API_PORT: '3000'
  HEALTH_PORT: '9090'
  METRICS_PORT: '9091'
  PEP_PORT: '3001'
  CLAI_PORT: '2222'
  SWASTIK_PORT: '3002'
  CREDENTIALS_SERVICE_BIND_HOST: '127.0.0.1'
  DATABASE_POOL_MAX: '10'
  DATABASE_STATEMENT_TIMEOUT: '30000'
  SLOW_QUERY_THRESHOLD_MS: '2000'
  CRITICAL_QUERY_THRESHOLD_MS: '10000'
  CACHE_L1_MAX_SIZE: '500'
  CACHE_L1_DEFAULT_TTL: '60000'
  CACHE_L2_DEFAULT_TTL: '3600000'
  QUEUE_CONCURRENCY_DEFAULT: '5'
  RATE_LIMIT_USER_MAX: '10'
  RATE_LIMIT_USER_WINDOW_MS: '60000'
  RATE_LIMIT_GUILD_MAX: '100'
  RATE_LIMIT_GUILD_WINDOW_MS: '60000'
  SHUTDOWN_TIMEOUT_MS: '180000'
  EVENT_BUS_MAX_EMIT_DEPTH: '10'
  OTEL_TRACING_ENABLED: 'true'
  TRACE_SAMPLE_RATE: '0.1'
  SWASTIK_STAGING_VOLUME_PATH: '/data/swastik-staging'
  SWASTIK_LIVE_VOLUME_PATH: '/data/swastik-live'
  PEP_TRUSTED_SOURCES: 'internal'
