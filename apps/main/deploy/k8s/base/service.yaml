apiVersion: v1
kind: Service
metadata:
  name: dumby
  labels:
    app: dumby
spec:
  selector:
    app: dumby
  ports:
    - name: api
      port: 3000
      targetPort: api
    - name: health
      port: 9090
      targetPort: health
    - name: metrics
      port: 9091
      targetPort: metrics
  type: ClusterIP
