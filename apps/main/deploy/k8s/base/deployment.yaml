apiVersion: apps/v1
kind: Deployment
metadata:
  name: dumby
  labels:
    app: dumby
    tier: bot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dumby
  # Rolling update — new pods fully ready before old ones terminate.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: dumby
        tier: bot
    spec:
      serviceAccountName: dumby
      # 190s = longest shutdown step sum (30 + 30 + 30 + 60 + 10 + 5 + 5 + 5 + 5)
      # plus a 10s orchestrator buffer. MUST be > SHUTDOWN_TIMEOUT_MS/1000.
      # See blueprint.md §4.3 and master-prompt.md Part 4.3.
      terminationGracePeriodSeconds: 190
      containers:
        - name: dumby
          image: dumby:latest
          imagePullPolicy: IfNotPresent
          command: ['node', 'dist/entry/main.js']
          envFrom:
            - configMapRef:
                name: dumby-config
            - secretRef:
                name: dumby-secrets
          ports:
            - name: api
              containerPort: 3000
            - name: health
              containerPort: 9090
            - name: metrics
              containerPort: 9091
          # Three distinct probes — each gate on its own bootstrap stage
          # (blueprint.md §8.2: "Never collapse these into one endpoint").
          #
          # startupProbe  → /health/startup  (200 once Stage 15 DISCORD_LOGIN reached)
          #   Prevents premature liveness checks during slow cold starts.
          # livenessProbe → /health/liveness (200 once Stage 04 OBSERVABILITY_INIT reached)
          #   Restarts the pod if the process hangs past the live threshold.
          # readinessProbe→ /health/readiness(200 once Stage 18 + required modules healthy)
          #   Removes the pod from Service endpoints while it is booting or draining.
          startupProbe:
            httpGet:
              path: /health/startup
              port: health
            # Allow up to 60s (12 × 5s) for Discord login before failing.
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: '250m'
              memory: '256Mi'
            limits:
              cpu: '1'
              memory: '1Gi'
          volumeMounts:
            - name: swastik-staging
              mountPath: /data/swastik-staging
            - name: swastik-live
              mountPath: /data/swastik-live
          lifecycle:
            preStop:
              exec:
                # Give the PID time to receive SIGTERM before SIGKILL.
                command: ['/bin/sleep', '5']
      volumes:
        - name: swastik-staging
          persistentVolumeClaim:
            claimName: dumby-swastik-staging
        - name: swastik-live
          persistentVolumeClaim:
            claimName: dumby-swastik-live
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
