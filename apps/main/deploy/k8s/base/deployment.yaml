apiVersion: apps/v1
kind: Deployment
metadata:
  name: dumby
  labels:
    app: dumby
    tier: bot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dumby
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: dumby
        tier: bot
    spec:
      serviceAccountName: dumby
      terminationGracePeriodSeconds: 190
      containers:
        - name: dumby
          # Pin to an immutable digest in production. `Always` at minimum, so a
          # node cannot keep serving a cached dumby:latest after a new build.
          image: dumby:latest
          imagePullPolicy: Always
          command: ['node', 'dist/entry/main.js']
          envFrom:
            - configMapRef:
                name: dumby-config
            - secretRef:
                name: dumby-secrets
          ports:
            - name: api
              containerPort: 3000
            - name: health
              containerPort: 9090
            - name: metrics
              containerPort: 9091
          startupProbe:
            httpGet:
              path: /health/startup
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: '250m'
              memory: '256Mi'
            limits:
              cpu: '1'
              memory: '1Gi'
          volumeMounts:
            - name: modules-admin
              mountPath: /mnt/modules/modules-admin
            - name: modules-core
              mountPath: /mnt/modules/modules-core
            - name: modules-standard
              mountPath: /mnt/modules/modules-standard
            - name: modules-marketplace
              mountPath: /mnt/modules/modules-marketplace
            - name: swastik-staging
              mountPath: /mnt/modules/swastik-staging
          lifecycle:
            preStop:
              exec:
                command: ['/bin/sleep', '5']
      volumes:
        - name: modules-admin
          persistentVolumeClaim:
            claimName: dumby-modules-admin
        - name: modules-core
          persistentVolumeClaim:
            claimName: dumby-modules-core
        - name: modules-standard
          persistentVolumeClaim:
            claimName: dumby-modules-standard
        - name: modules-marketplace
          persistentVolumeClaim:
            claimName: dumby-modules-marketplace
        - name: swastik-staging
          persistentVolumeClaim:
            claimName: dumby-swastik-staging
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
