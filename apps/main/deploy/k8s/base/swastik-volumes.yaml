apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dumby-modules-admin
  labels:
    app: dumby
    component: modules
    module-tier: admin
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
