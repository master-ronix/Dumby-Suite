apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dumby-swastik-staging
  labels:
    app: dumby
    component: swastik
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dumby-swastik-live
  labels:
    app: dumby
    component: swastik
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
