# Dumby CI — strict fail-fast sequence per directive.md D-8.4
#
# Mirror of the local verification chain (AGENTS.md): typecheck → lint → format →
# test:unit + test:coverage → test:integration → docker build.
#
# The gates job is a SINGLE job with sequential steps: a later gate never runs if an
# earlier one fails (D-8.4). The integration job additionally applies migrations
# against live Postgres + Redis (D-8.10) and the docker job verifies the D-8.6
# multi-stage image builds from the workspace root context.
name: CI

on:
  push:
    # feature/dev auto-deploys to Railway production, so it must be gated too — this is the
    # branch the migration incident reached production through (CI ran only on main before).
    branches: [main, feature/dev]
  pull_request:

permissions:
  contents: read
  # gitleaks-action lists the PR's commits on pull_request events
  # (GET /repos/.../pulls/{n}/commits). Without this the call returns 403
  # "Resource not accessible by integration", which aborts the fail-fast gates job
  # at the Secret scanning step, so no real gate ever runs on a pull request.
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates (D-8.4 strict sequence)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks + dependency review require full history

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Dependency review (pnpm audit)
        # Replaces actions/dependency-review-action, which requires GitHub Advanced Security —
        # not available on private repositories — so it failed on every pull_request run and
        # aborted the gates job at ~7s (the real gates never ran on PRs). pnpm audit works on
        # private repos and reports the same class of finding. ADVISORY (continue-on-error) until
        # the existing advisory backlog is triaged; drop continue-on-error to make it a hard gate.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: pnpm audit --audit-level=high --prod

      - name: Build workspace packages
        # The app imports `@workspace/swastik` (and its subpaths) at runtime and in tests. Those
        # exports resolve to the package's `dist/`, so the workspace packages must be built before
        # the flow/unit suites run — otherwise they fail with ERR_MODULE_NOT_FOUND.
        run: pnpm -r --filter "./packages/**" --if-present run build

      - name: Gate 1 — typecheck, strict (first gate)
        run: |
          pnpm typecheck
          pnpm --filter @workspace/dumby typecheck

      - name: Gate 2 — lint (architecture rules, zero warnings)
        run: pnpm --filter @workspace/dumby lint

      - name: Gate 2b — lint (module architecture rules, zero warnings)
        run: pnpm run lint:modules

      - name: Gate 3 — format gate
        run: pnpm --filter @workspace/dumby format

      - name: Gate 3b — ConfigMap ↔ ENV_KEYS drift guard
        run: node apps/main/scripts/check-configmap-keys.mjs

      - name: Fetch libicu60 (embedded-postgres initdb needs it; ubuntu-24.04 ships ICU 74)
        # The bundled @embedded-postgres linux-x64 initdb is linked against ICU 60, which the
        # ubuntu-24.04 archives do not carry. Fetch the focal library files (checksum-pinned) and
        # expose them via LD_LIBRARY_PATH for the flow suite — no system-wide install.
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/icu60"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/libicu60.deb" \
            "http://archive.ubuntu.com/ubuntu/pool/main/i/icu/libicu60_60.2-3ubuntu3.2_amd64.deb"
          echo "f01f61f57e63dc905e02e6441d10370fe0c79e43e70e6f5fe24b342fd2633209  $dir/libicu60.deb" | sha256sum -c -
          dpkg-deb -x "$dir/libicu60.deb" "$dir/root"
          echo "LD_LIBRARY_PATH=$dir/root/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Flow suite — bootstrap → wiring → shutdown (embedded PostgreSQL)
        run: pnpm --filter @workspace/dumby test:flow

      - name: Gate 4 — unit tests + coverage floors
        run: pnpm --filter @workspace/dumby test:coverage

      - name: Gate 5 — production build compiles
        run: pnpm --filter @workspace/dumby build

      - name: Gate 5b — compiled artifact resolves workspace deps at runtime
        # Guards the deploy regression: `apps/main` runs with plain `node`, so every
        # workspace dependency it imports at runtime must resolve to compiled JS, not
        # raw .ts source. A missing build step fails the deploy, not the build itself.
        # Run from apps/main: the workspace package is linked into apps/main/node_modules,
        # not the repo root's, so resolving it from the root throws ERR_MODULE_NOT_FOUND.
        working-directory: apps/main
        run: |
          node --input-type=module -e "await import('@workspace/swastik'); await import('@workspace/swastik/manifest'); await import('@workspace/swastik/validate'); console.log('workspace runtime resolution OK')"

      - name: SBOM for provenance binding
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          artifact-name: sbom-spdx

      - name: Supply-chain hashing (lockfile, build artifact, gate results)
        run: |
          set -euo pipefail
          tar -czf dist-archive.tar.gz -C apps/main dist
          sha256sum pnpm-lock.yaml dist-archive.tar.gz > supply-chain.sha256
          {
            echo "## Supply-chain hashes (immutable build provenance, D-8.4)"
            echo
            echo '```'
            cat supply-chain.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: Integration (live Postgres + Redis, D-8.10)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: gates
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dumby
          POSTGRES_PASSWORD: dumby_dev_password
          POSTGRES_DB: dumby
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dumby"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://dumby:dumby_dev_password@localhost:5432/dumby
      REDIS_URL: redis://localhost:6379/0
      QUEUE_REDIS_URL: redis://localhost:6379/1
      DATABASE_REPLICA_URLS: ""
      DISCORD_ADAPTER: mock
      BOT_TOKEN: ""
      INTERNAL_API_KEY: ci_internal_api_key
      JWT_SIGNING_KEY: ci_jwt_signing_key_32_chars_minimum
      ENCRYPTION_KEY_CURRENT: ci_encryption_key_current_32_bytes!
      CLAI_AUTHKEY_STORAGE_URL: postgres://dumby:dumby_dev_password@localhost:5432/dumby
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        # The integration suite imports @workspace/swastik, whose exports resolve to the
        # package's dist/ — unbuilt here, so the suite aborts with ERR_MODULE_NOT_FOUND.
        run: pnpm -r --filter "./packages/**" --if-present run build

      - name: Apply migrations
        run: pnpm --filter @workspace/dumby migrate

      - name: Integration suite
        run: pnpm --filter @workspace/dumby test:integration

  docker:
    name: Docker build (D-8.6 context = workspace root)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: gates
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image
        run: docker build --file apps/main/Dockerfile --tag dumby:ci .
