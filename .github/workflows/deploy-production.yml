name: Deploy — Production

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: 'Git SHA to deploy (must already be staged and smoke-tested)'
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.image_sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set up kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.29.0
      - name: Configure kubeconfig
        # Secrets reach steps as env values, never interpolated into the command line (D-8.4).
        env:
          KUBECONFIG_PRODUCTION: ${{ secrets.KUBECONFIG_PRODUCTION }}
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/kubeconfig.yaml' EXIT
          printf '%s' "$KUBECONFIG_PRODUCTION" | base64 -d > /tmp/kubeconfig.yaml
      - name: Run DB migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          kubectl --kubeconfig /tmp/kubeconfig.yaml -n dumby-production \
            run dumby-migrate-$(date +%s) \
            --image=${{ vars.IMAGE_REGISTRY }}/dumby:${{ github.event.inputs.image_sha }} \
            --restart=Never \
            --env="DATABASE_URL=$DATABASE_URL" \
            --command -- tsx src/entry/migrate.ts up
      - name: Apply K8s manifests
        run: |
          kubectl --kubeconfig /tmp/kubeconfig.yaml apply \
            -k deploy/k8s/overlays/production
      - name: Update image tag
        run: |
          kubectl --kubeconfig /tmp/kubeconfig.yaml -n dumby-production \
            set image deployment/dumby dumby=${{ vars.IMAGE_REGISTRY }}/dumby:${{ github.event.inputs.image_sha }}
      - name: Wait for rollout
        # terminationGracePeriodSeconds is 190s → allow the full drain window.
        run: |
          kubectl --kubeconfig /tmp/kubeconfig.yaml -n dumby-production \
            rollout status deployment/dumby --timeout=240s
