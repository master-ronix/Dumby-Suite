name: Deploy — Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @workspace/dumby typecheck
      - name: Set up kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.29.0
      - name: Configure kubeconfig
        # Secrets reach steps as env values, never interpolated into the command line (D-8.4).
        env:
          KUBECONFIG_STAGING: ${{ secrets.KUBECONFIG_STAGING }}
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/kubeconfig.yaml' EXIT
          printf '%s' "$KUBECONFIG_STAGING" | base64 -d > /tmp/kubeconfig.yaml
      - name: Run DB migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          kubectl --kubeconfig /tmp/kubeconfig.yaml -n dumby-staging \
            run dumby-migrate-$(date +%s) \
            --image=${{ vars.IMAGE_REGISTRY }}/dumby:${{ github.sha }} \
            --restart=Never \
            --env="DATABASE_URL=$DATABASE_URL" \
            --command -- tsx src/entry/migrate.ts up
      - name: Apply K8s manifests
        run: |
          kubectl --kubeconfig /tmp/kubeconfig.yaml apply \
            -k deploy/k8s/overlays/staging
      - name: Update image tag
        run: |
          kubectl --kubeconfig /tmp/kubeconfig.yaml -n dumby-staging \
            set image deployment/dumby dumby=${{ vars.IMAGE_REGISTRY }}/dumby:${{ github.sha }}
      - name: Wait for rollout
        run: |
          kubectl --kubeconfig /tmp/kubeconfig.yaml -n dumby-staging \
            rollout status deployment/dumby --timeout=180s
