# Dumby — Dependabot configuration (UR-C-13 / UR-B-21 CI hygiene, E5 §31).
#
# Keeps the two supply-chain surfaces current: the GitHub Actions used by CI (pinned by commit
# SHA in `.github/workflows/`, so Dependabot is how those pins move) and the pnpm workspace's
# npm dependencies. Weekly, grouped, so review stays bounded.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Same reason: the workflows that matter are the ones CI runs from `feature/dev`.
    target-branch: feature/dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    # THE DEPLOY BRANCH, not the default one. `feature/dev` is what Railway ships and what CI
    # gates; `main` is the older default and sits ~181 commits behind. Updates raised against
    # `main` were therefore evaluated against a base whose own Gates were red, and a green result
    # there would still never have reached a deploy.
    target-branch: feature/dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: ['minor', 'patch']
      # THE RUNNER AND ITS COVERAGE PROVIDER MOVE TOGETHER, OR NOT AT ALL.
      #
      # `@vitest/coverage-v8`'s major must equal `vitest`'s major: the provider is loaded by the
      # runner, and a provider one major ahead fails to load, taking Gate 4 (unit tests + coverage
      # floors) down on an otherwise-healthy tree. Left ungrouped, Dependabot raised exactly that —
      # a lone `@vitest/coverage-v8` 4 -> 5 against `vitest` still on ^4. Restricting this group to
      # MAJOR keeps it disjoint from `npm-minor-patch` above, so no dependency matches two groups.
      vitest-major:
        applies-to: version-updates
        patterns: ['vitest', '@vitest/*']
        update-types: ['major']
